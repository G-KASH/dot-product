<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Array Algorithms</title>

</head>
<body>

  <h1>JavaScript Array Algorithms</h1>

  <!-- Problem 1 -->
  <div class="section">
    <h2>Problem 1: Sum of Distinct Elements</h2>
    <p><strong>Set 1:</strong> [3, 1, 7, 9]<br><strong>Set 2:</strong> [2, 4, 1, 9, 3]</p>
    <div id="distinct-sum" class="result"></div>
  </div>

  <!-- Problem 2 -->
  <div class="section">
    <h2>Problem 2: Dot Product & Orthogonality</h2>
    <p>Check if pairs of vectors are orthogonal using the dot product formula.</p>
    <div id="dot-product-results"></div>
  </div>

  <script>
    // ---------- Problem 1 ----------
    function sumOfDistinct(set1, set2) {
      let sum = 0;

      for (let i = 0; i < set1.length; i++) {
        if (!set2.includes(set1[i])) sum += set1[i];
      }

      for (let i = 0; i < set2.length; i++) {
        if (!set1.includes(set2[i])) sum += set2[i];
      }

      return sum;
    }

    const set1 = [3, 1, 7, 9];
    const set2 = [2, 4, 1, 9, 3];
    const distinctSumResult = sumOfDistinct(set1, set2);
    document.getElementById("distinct-sum").innerText = "Sum of distinct elements: " + distinctSumResult;

    // ---------- Problem 2 ----------
    function dotProduct(v1, v2) {
      let result = 0;
      for (let i = 0; i < v1.length; i++) {
        result += v1[i] * v2[i];
      }
      return result;
    }

    function checkOrthogonality(pairs) {
      const output = document.getElementById("dot-product-results");

      pairs.forEach((pair, index) => {
        const [v1, v2] = pair;
        const result = dotProduct(v1, v2);
        const message = document.createElement("p");

        if (result === 0) {
          message.innerHTML = `Pair ${index + 1}: ${JSON.stringify(v1)} and ${JSON.stringify(v2)} are <span class="result">orthogonal</span>.`;
        } else {
          message.innerHTML = `Pair ${index + 1}: ${JSON.stringify(v1)} and ${JSON.stringify(v2)} are <span class="not-ortho">not orthogonal</span>. (Dot product: ${result})`;
        }

        output.appendChild(message);
      });
    }

    const vectorPairs = [
      [[1, 2], [2, -1]],
      [[3, 4], [4, 3]],
      [[1, 0], [0, 1]]
    ];

    checkOrthogonality(vectorPairs);
  </script>

</body>
</html>
